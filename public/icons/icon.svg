<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#2563eb"/>
  <g transform="translate(256,240)">
    <!-- Bus body -->
    <rect x="-120" y="-60" width="240" height="120" rx="20" fill="#ffffff"/>
    <!-- Windows -->
    <rect x="-95" y="-45" width="50" height="40" rx="6" fill="#bfdbfe"/>
    <rect x="-35" y="-45" width="50" height="40" rx="6" fill="#bfdbfe"/>
    <rect x="25" y="-45" width="50" height="40" rx="6" fill="#bfdbfe"/>
    <!-- Wheels -->
